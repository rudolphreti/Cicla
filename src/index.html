<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="assets/cicla.svg">
    <!-- Primary Meta Tags -->
    <title>Cicla - Anwendung zum Verschlüsseln mit einem Schlüssel</title>
    <meta name="title" content="Cicla - Anwendung zum Verschlüsseln mit einem Schlüssel">
    <meta name="description" content="Diese völlig kostenlose App generiert eine Chiffre, die nicht geknackt werden kann. Entschlüsselung ist nur mit dem passenden Schlüssel möglich.">
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="http://cicla.freuciv.com/">
    <meta property="og:title" content="Cicla - Anwendung zum Verschlüsseln mit einem Schlüssel">
    <meta property="og:description" content="Diese völlig kostenlose App generiert eine Chiffre, die nicht geknackt werden kann. Entschlüsselung ist nur mit dem passenden Schlüssel möglich.">
    <meta property="og:image" content="http://cicla.freuciv.com/assets/logo-social.png">
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="http://cicla.freuciv.com/">
    <meta property="twitter:title" content="Cicla - Anwendung zum Verschlüsseln mit einem Schlüssel">
    <meta property="twitter:description" content="Diese völlig kostenlose App generiert eine Chiffre, die nicht geknackt werden kann. Entschlüsselung ist nur mit dem passenden Schlüssel möglich.">
    <meta property="twitter:image" content="http://cicla.freuciv.com/assets/logo-social.png">
</head>

    <body>
        <div class="top-bar">
            <button class="icon-button" onclick="openPrintDialog()" aria-label="Drucken">🖨️</button>
        </div>
            <div class="main-container">
                <div class="sub-container">
                    <h1>Schlüssel</h1>
                    <p id="key-update-message" class="info-message"></p>
                    <textarea spellcheck="false" id="key" class="editable-area">eh,KSwad rn  hgrlad D­rtzhnlwtioenapsDcieufnta  .tTcsegedhiecar,euVä ckbsö nlcedie.ei uIa nwe imeneslfeenWs cetii aübeüirla D9khee8arft</textarea>
                    <div id="key-bottom-elements" class="margin-top">
                        <button class="myButton key-bottom-element" onclick="shuffleKeyChars()">Zeichen mischen</button>
                        <div id="caret-position" class="key-bottom-element"></div>
                    </div>
                    <h1>Nachricht</h1>
                    <textarea spellcheck="false" id="message" class="editable-area">Ich bin selbst die Veränderung, die ich mir wünsche, in der Welt zu sehen. </textarea>
                    <h1>Nachricht verschlüsselt</h1>
                    <textarea spellcheck="false" id="message-encrypted" class="editable-area"></textarea>
                    <button class="myButton margin-top" onclick="decryptMessage()">Diese Nachricht entschlüsseln</button>
                    <h1 id="message-decrypted-title">Nachricht entschlüsselt</h1>
                    <div id="message-decrypted" class="output-area"></div>
                </div>
            </div>
    <div id="print-dialog" class="modal">
      <div class="modal-content">
        <h2>Druckoptionen</h2>
        <div class="print-option">
          <label>
            <input type="radio" name="print-option" value="filled" checked onchange="updatePrintOptionVisibility()">
            Zu entschlüsselnde Nachricht + Schlüssel
          </label>
          <p class="option-description">Enthält die aktuelle verschlüsselte Nachricht und den Schlüssel aus der Anwendung.</p>
        </div>
        <div class="print-option">
          <label>
            <input type="radio" name="print-option" value="blank" onchange="updatePrintOptionVisibility()">
            Leere Tabellen zum manuellen Ausfüllen
          </label>
          <p class="option-description">Erzeugt leere Zeilenpaare zum Drucken und handschriftlichen Ausfüllen.</p>
          <div id="blank-print-options" class="blank-options">
            <label for="print-message-rows" class="input-label">Anzahl der Zeilenpaare für die Nachricht</label>
            <input id="print-message-rows" type="number" min="1" value="5">
            <label for="print-key-rows" class="input-label">Anzahl der Zeilenpaare für den Schlüssel</label>
            <input id="print-key-rows" type="number" min="1" value="5">
          </div>
        </div>
        <div class="dialog-actions">
          <button class="myButton" onclick="handlePrintDownload()">Drucken</button>
          <button class="myButton secondary" onclick="closePrintDialog()">Abbrechen</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
